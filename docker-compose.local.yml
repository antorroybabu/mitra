services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mitra
      MYSQL_USER: mitra
      MYSQL_PASSWORD: mitra_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  mysql_data:
  redis_data:
